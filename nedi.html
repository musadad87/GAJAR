<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Order Stok Bengkel Motor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 antialiased">

  <!-- Navigation Header -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-30 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-amber-500 to-amber-400 p-2.5 rounded-xl text-slate-950 font-black shadow-md">
          <i class="fa-solid fa-wrench text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-wide leading-tight">Order Stok Bengkel</h1>
          <div class="flex items-center gap-2">
            <span id="syncBadge" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30">
              <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
              Menghubungkan...
            </span>
          </div>
        </div>
      </div>

      <!-- Role Switcher -->
      <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-700/80 text-xs">
        <button id="btnRoleMekanik" onclick="window.setRole('mekanik')" class="px-3 py-1.5 rounded-lg transition-all bg-amber-500 text-slate-950 font-bold shadow">
          <i class="fa-solid fa-user-gear mr-1"></i> Mode Mekanik
        </button>
        <button id="btnRoleBos" onclick="window.setRole('bos')" class="px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium">
          <i class="fa-solid fa-user-tie mr-1"></i> Mode Bos
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

    <!-- Metrics Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400">Belum Dipesan</p>
          <p class="text-2xl font-bold text-amber-400 mt-0.5" id="countBelum">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
          <i class="fa-solid fa-hourglass-start text-lg"></i>
        </div>
      </div>

      <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400">Sudah Dipesan</p>
          <p class="text-2xl font-bold text-blue-400 mt-0.5" id="countDipesan">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
          <i class="fa-solid fa-truck-fast text-lg"></i>
        </div>
      </div>

      <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700/60 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400">Ada di Bengkel</p>
          <p class="text-2xl font-bold text-emerald-400 mt-0.5" id="countSelesai">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
          <i class="fa-solid fa-circle-check text-lg"></i>
        </div>
      </div>

      <div class="bg-slate-800 p-3.5 rounded-2xl border border-rose-500/30 bg-rose-950/10 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-rose-300">Stok Darurat</p>
          <p class="text-2xl font-bold text-rose-400 mt-0.5" id="countUrgent">0</p>
        </div>
        <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center">
          <i class="fa-solid fa-triangle-exclamation text-lg animate-pulse"></i>
        </div>
      </div>
    </div>

    <!-- Action Panel & Quick Fill -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-4">
      <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
        <!-- Search -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="window.filterData()" placeholder="Cari barang, motor, atau mekanik..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div class="flex items-center gap-2">
          <!-- Filter Status -->
          <select id="filterStatus" onchange="window.filterData()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-amber-500">
            <option value="semua">Semua Status</option>
            <option value="Belum Dipesan">⏳ Belum Dipesan</option>
            <option value="Dipesan">🚚 Dipesan</option>
            <option value="Ada di Bengkel">✅ Ada di Bengkel</option>
            <option value="urgent">🚨 Khusus Urgent</option>
          </select>

          <!-- Filter Kategori -->
          <select id="filterKategori" onchange="window.filterData()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-amber-500">
            <option value="semua">Semua Kategori</option>
            <option value="Oli & Cairan">Oli & Cairan</option>
            <option value="Kampas & Rem">Kampas & Rem</option>
            <option value="Ban & Velg">Ban & Velg</option>
            <option value="Busi & Kelistrikan">Busi & Kelistrikan</option>
            <option value="Engine & Rantai">Engine & Rantai</option>
            <option value="Lainnya">Lainnya</option>
          </select>

          <button onclick="window.bukaModalTambah()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-1.5 whitespace-nowrap">
            <i class="fa-solid fa-plus text-sm"></i> Tambah Order
          </button>
        </div>
      </div>

      <!-- Quick Fill Shortcuts -->
      <div class="pt-2 border-t border-slate-700/60">
        <span class="text-[11px] font-semibold text-slate-400 mr-2 uppercase tracking-wider block mb-1.5">Isi Cepat Sparepart Sering Habis:</span>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="window.quickFill('Oli MPX2 0.8L', 'Oli & Cairan', 'Honda Beat/Vario')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition">
            + Oli MPX2
          </button>
          <button onclick="window.quickFill('Kampas Rem Depan', 'Kampas & Rem', 'Honda Matic')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition">
            + Kampas Rem Depan Beat
          </button>
          <button onclick="window.quickFill('Busi CPR9EA-9', 'Busi & Kelistrikan', 'Vario / NMAX')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition">
            + Busi NGK
          </button>
          <button onclick="window.quickFill('Aki GTZ5S 12V', 'Busi & Kelistrikan', 'Universal')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition">
            + Aki GS
          </button>
        </div>
      </div>
    </div>

    <!-- Orders Cards Grid -->
    <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Data order akan di-render melalui Javascript -->
    </div>

  </main>

  <!-- Modal Tambah Order -->
  <div id="modalTambah" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-box-archive text-amber-400"></i> Form Order Sparepart
        </h3>
        <button onclick="window.tutupModal('modalTambah')" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="formTambahOrder" onsubmit="window.prosesTambahOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Nama Barang / Sparepart *</label>
          <input type="text" id="inputNama" required placeholder="Contoh: Oli Yamalube Matic 0.8L" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Kategori *</label>
            <select id="inputKategori" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
              <option value="Oli & Cairan">Oli & Cairan</option>
              <option value="Kampas & Rem">Kampas & Rem</option>
              <option value="Ban & Velg">Ban & Velg</option>
              <option value="Busi & Kelistrikan">Busi & Kelistrikan</option>
              <option value="Engine & Rantai">Engine & Rantai</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Jumlah (Qty) *</label>
            <input type="text" id="inputQty" required placeholder="Misal: 5 Botol / 2 Pcs" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Untuk Motor</label>
            <input type="text" id="inputMotor" placeholder="Contoh: Honda Beat / NMAX" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Nama Pemohon (Mekanik)</label>
            <input type="text" id="inputPemohon" placeholder="Contoh: Alex" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Catatan Tambahan</label>
          <input type="text" id="inputCatatan" placeholder="Contoh: Stok di etalase sudah habis total" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-amber-500 focus:outline-none">
        </div>

        <div class="flex items-center gap-2 bg-rose-950/30 p-3 rounded-xl border border-rose-500/30">
          <input type="checkbox" id="inputUrgent" class="w-4 h-4 rounded text-rose-500 border-slate-700 bg-slate-900 focus:ring-0">
          <label for="inputUrgent" class="text-xs text-rose-300 font-semibold cursor-pointer">
            🚨 Tandai Stok Darurat (Barang Sangat Dibutuhkan)
          </label>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="window.tutupModal('modalTambah')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition shadow-md">
            Simpan Order
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Update Status Bos -->
  <div id="modalStatusBos" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-tie text-blue-400"></i> Update Status Order (Bos)
        </h3>
        <button onclick="window.tutupModal('modalStatusBos')" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="formStatusBos" onsubmit="window.prosesUpdateBos(event)" class="space-y-4">
        <input type="hidden" id="bosOrderId">

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Status Pemesanan</label>
          <select id="bosStatusChoice" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
            <option value="Belum Dipesan">⏳ Belum Dipesan</option>
            <option value="Dipesan">🚚 Sudah Dipesan (Proses Kirim)</option>
            <option value="Ada di Bengkel">✅ Sudah Tiba di Bengkel</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Pesan dari Bos (Opsional)</label>
          <textarea id="bosPesan" rows="3" placeholder="Contoh: Sudah diorder dari Tokopedia, resi JNE123. Perkiraan sampai besok siang." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="window.tutupModal('modalStatusBos')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white transition shadow-md">
            Update Status
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Hapus -->
  <div id="modalHapus" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">Hapus Order Barang?</h3>
        <p class="text-xs text-slate-400 mt-1">Data orderan ini akan dihapus permanen.</p>
      </div>
      <div class="flex justify-center gap-2 pt-2">
        <button onclick="window.tutupModal('modalHapus')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
          Batal
        </button>
        <button onclick="window.prosesHapusOrder()" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white transition shadow-md">
          Ya, Hapus
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* Global Variables */
    let db = null;
    let auth = null;
    let ordersCollectionRef = null;
    let ordersData = [];
    let currentRole = 'mekanik';
    let targetDeleteId = null;
    let isLocalStorageMode = false;

    /* Helper function for Toast Notifications */
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-700';
      toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-2 transition-all transform translate-y-2 opacity-0`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-info-circle'}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    /* Role Switcher Handler */
    window.setRole = function(role) {
      currentRole = role;
      const btnMekanik = document.getElementById('btnRoleMekanik');
      const btnBos = document.getElementById('btnRoleBos');
      if (role === 'mekanik') {
        if (btnMekanik) btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all bg-amber-500 text-slate-950 font-bold shadow";
        if (btnBos) btnBos.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium";
      } else {
        if (btnBos) btnBos.className = "px-3 py-1.5 rounded-lg transition-all bg-blue-600 text-white font-bold shadow";
        if (btnMekanik) btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium";
      }
      window.filterData();
    };

    /* Modal Management */
    window.bukaModal = function(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove('hidden');
    };

    window.tutupModal = function(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add('hidden');
    };

    window.bukaModalTambah = function() {
      const form = document.getElementById('formTambahOrder');
      if (form) form.reset();
      window.bukaModal('modalTambah');
    };

    window.bukaModalStatusBos = function(id) {
      const item = ordersData.find(o => o.id === id);
      if (item) {
        document.getElementById('bosOrderId').value = id;
        document.getElementById('bosStatusChoice').value = item.status || 'Dipesan';
        document.getElementById('bosPesan').value = item.pesanBos || '';
        window.bukaModal('modalStatusBos');
      }
    };

    window.bukaModalHapus = function(id) {
      targetDeleteId = id;
      window.bukaModal('modalHapus');
    };

    window.quickFill = function(nama, kategori, motor) {
      document.getElementById('inputNama').value = nama;
      document.getElementById('inputKategori').value = kategori;
      document.getElementById('inputMotor').value = motor;
      window.bukaModal('modalTambah');
    };

    /* Update Badge Status UI */
    function updateSyncBadge(type, text) {
      const badge = document.getElementById('syncBadge');
      if (!badge) return;

      if (type === 'online') {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${text}`;
      } else if (type === 'local') {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> ${text}`;
      } else {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-700 text-slate-300 border border-slate-600";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></span> ${text}`;
      }
    }

    /* Fallback Local Storage Mode */
    function aktifkanModeLokal(alasan) {
      isLocalStorageMode = true;
      updateSyncBadge('local', 'Penyimpanan Lokal (Offline)');
      console.info("Info:", alasan);
      loadFromLocalStorage();
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem('bengkel_orders_data');
      if (stored) {
        try {
          ordersData = JSON.parse(stored);
        } catch(e) {
          ordersData = [];
        }
      } else {
        ordersData = [
          {
            id: 'sample-1',
            nama: 'Oli Yamalube Silver 0.8L',
            kategori: 'Oli & Cairan',
            qty: '10 Botol',
            motor: 'Yamaha Jupiter/Vega',
            pemohon: 'Mekanik Budi',
            catatan: 'Stok di etalase sisa 1 botol',
            urgent: true,
            status: 'Belum Dipesan',
            tanggal: new Date().toLocaleDateString('id-ID')
          },
          {
            id: 'sample-2',
            nama: 'Kampas Rem Depan Beat',
            kategori: 'Kampas & Rem',
            qty: '5 Set',
            motor: 'Honda Beat All Series',
            pemohon: 'Mekanik Agus',
            catatan: 'Laris banget',
            urgent: false,
            status: 'Dipesan',
            pesanBos: 'Sudah diorder dari Supplier Surabaya, estimasi tiba besok sore',
            tanggal: new Date().toLocaleDateString('id-ID')
          }
        ];
        saveToLocalStorage();
      }
      window.filterData();
    }

    function saveToLocalStorage() {
      localStorage.setItem('bengkel_orders_data', JSON.stringify(ordersData));
      window.filterData();
    }

    /* Filter & Render Data Cards */
    window.filterData = function() {
      const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const statusVal = document.getElementById('filterStatus')?.value || 'semua';
      const katVal = document.getElementById('filterKategori')?.value || 'semua';

      let countBelum = 0, countDipesan = 0, countSelesai = 0, countUrgent = 0;
      ordersData.forEach(item => {
        if (item.status === 'Belum Dipesan') countBelum++;
        if (item.status === 'Dipesan') countDipesan++;
        if (item.status === 'Ada di Bengkel') countSelesai++;
        if (item.urgent) countUrgent++;
      });

      if (document.getElementById('countBelum')) document.getElementById('countBelum').innerText = countBelum;
      if (document.getElementById('countDipesan')) document.getElementById('countDipesan').innerText = countDipesan;
      if (document.getElementById('countSelesai')) document.getElementById('countSelesai').innerText = countSelesai;
      if (document.getElementById('countUrgent')) document.getElementById('countUrgent').innerText = countUrgent;

      const filtered = ordersData.filter(item => {
        const matchSearch = (item.nama || '').toLowerCase().includes(searchVal) ||
                            (item.motor || '').toLowerCase().includes(searchVal) ||
                            (item.pemohon || '').toLowerCase().includes(searchVal);
        
        let matchStatus = true;
        if (statusVal === 'urgent') {
          matchStatus = item.urgent === true;
        } else if (statusVal !== 'semua') {
          matchStatus = item.status === statusVal;
        }

        let matchKat = true;
        if (katVal !== 'semua') {
          matchKat = item.kategori === katVal;
        }

        return matchSearch && matchStatus && matchKat;
      });

      const container = document.getElementById('ordersContainer');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-slate-800/60 p-8 rounded-2xl border border-slate-700/60 text-center text-slate-400">
            <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-500"></i>
            <p class="text-sm">Belum ada orderan sparepart yang sesuai.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        let statusIcon = 'fa-hourglass-start';
        if (item.status === 'Dipesan') {
          badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
          statusIcon = 'fa-truck-fast';
        } else if (item.status === 'Ada di Bengkel') {
          badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
          statusIcon = 'fa-circle-check';
        }

        return `
          <div class="bg-slate-800 p-4 rounded-2xl border ${item.urgent ? 'border-rose-500/50 bg-rose-950/10' : 'border-slate-700/70'} shadow-sm space-y-3 relative flex flex-col justify-between">
            <div class="space-y-2">
              <div class="flex justify-between items-start gap-2">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg bg-slate-900 text-slate-300 border border-slate-700">${item.kategori || 'Sparepart'}</span>
                    ${item.urgent ? '<span class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse">🚨 URGENT</span>' : ''}
                  </div>
                  <h3 class="font-bold text-white text-base mt-1.5">${item.nama}</h3>
                </div>
                <span class="px-2.5 py-1 text-xs font-bold rounded-full border flex items-center gap-1.5 ${badgeColor}">
                  <i class="fa-solid ${statusIcon}"></i> ${item.status || 'Belum Dipesan'}
                </span>
              </div>

              <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
                <div><span class="text-slate-500">Motor:</span> <strong class="text-slate-200">${item.motor || '-'}</strong></div>
                <div><span class="text-slate-500">Jumlah:</span> <strong class="text-amber-400 font-bold">${item.qty || '-'}</strong></div>
                <div><span class="text-slate-500">Mekanik:</span> <strong class="text-slate-200">${item.pemohon || '-'}</strong></div>
                <div><span class="text-slate-500">Tanggal:</span> <strong class="text-slate-200">${item.tanggal || '-'}</strong></div>
              </div>

              ${item.catatan ? `<p class="text-xs text-amber-200/90 italic bg-amber-950/20 p-2 rounded-lg border border-amber-500/20"><i class="fa-regular fa-note-sticky mr-1 text-amber-400"></i> Catatan: ${item.catatan}</p>` : ''}

              ${item.pesanBos ? `
                <div class="text-xs text-blue-200 bg-blue-950/30 p-2.5 rounded-xl border border-blue-500/30 flex items-start gap-2">
                  <i class="fa-solid fa-user-tie text-blue-400 mt-0.5"></i>
                  <div>
                    <strong class="block text-[10px] uppercase tracking-wider text-blue-400 font-bold">Pesan Bos Bengkel:</strong>
                    <span>${item.pesanBos}</span>
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-700/60 mt-2">
              <div class="flex gap-1.5">
                ${item.status === 'Dipesan' ? `
                  <button onclick="window.tandaiTibaDirect('${item.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1">
                    <i class="fa-solid fa-box-open"></i> Barang Tiba
                  </button>
                ` : ''}
                ${currentRole === 'bos' ? `
                  <button onclick="window.bukaModalStatusBos('${item.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> Update Bos
                  </button>
                ` : ''}
              </div>

              <button onclick="window.bukaModalHapus('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition" title="Hapus Order">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    };

    /* Form Handler - Add Order */
    window.prosesTambahOrder = async function(e) {
      e.preventDefault();
      const nama = document.getElementById('inputNama').value;
      const kategori = document.getElementById('inputKategori').value;
      const qty = document.getElementById('inputQty').value;
      const motor = document.getElementById('inputMotor').value || 'Universal';
      const pemohon = document.getElementById('inputPemohon').value || 'Mekanik';
      const catatan = document.getElementById('inputCatatan').value || '';
      const urgent = document.getElementById('inputUrgent').checked;

      const newOrder = {
        nama,
        kategori,
        qty,
        motor,
        pemohon,
        catatan,
        urgent,
        status: 'Belum Dipesan',
        pesanBos: '',
        tanggal: new Date().toLocaleDateString('id-ID')
      };

      if (!isLocalStorageMode && ordersCollectionRef) {
        try {
          await addDoc(ordersCollectionRef, newOrder);
          window.showToast('Order sparepart berhasil disimpan!');
        } catch (err) {
          console.error("Gagal menambah doc Firebase:", err);
          window.showToast('Error menyimpan online, beralih ke lokal', 'error');
          newOrder.id = 'loc-' + Date.now();
          ordersData.unshift(newOrder);
          saveToLocalStorage();
        }
      } else {
        newOrder.id = 'loc-' + Date.now();
        ordersData.unshift(newOrder);
        saveToLocalStorage();
        window.showToast('Order sparepart disimpan lokal');
      }

      window.tutupModal('modalTambah');
    };

    /* Form Handler - Bos Status Update */
    window.prosesUpdateBos = async function(e) {
      e.preventDefault();
      const id = document.getElementById('bosOrderId').value;
      const statusChoice = document.getElementById('bosStatusChoice').value;
      const pesanBos = document.getElementById('bosPesan').value;

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ordersCollectionRef.path, id);
          await updateDoc(docRef, {
            status: statusChoice,
            pesanBos: pesanBos
          });
          window.showToast('Status berhasil diupdate!');
        } catch(err) {
          console.error("Gagal update doc:", err);
          updateLocalItem(id, statusChoice, pesanBos);
        }
      } else {
        updateLocalItem(id, statusChoice, pesanBos);
      }

      window.tutupModal('modalStatusBos');
    };

    function updateLocalItem(id, statusChoice, pesanBos) {
      const idx = ordersData.findIndex(o => o.id === id);
      if (idx !== -1) {
        ordersData[idx].status = statusChoice;
        ordersData[idx].pesanBos = pesanBos;
        saveToLocalStorage();
        window.showToast('Status diupdate lokal');
      }
    }

    /* Direct Mark Arrived */
    window.tandaiTibaDirect = async function(id) {
      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ordersCollectionRef.path, id);
          await updateDoc(docRef, { status: 'Ada di Bengkel' });
          window.showToast('Barang ditandai Tiba di Bengkel!');
        } catch(err) {
          updateLocalItem(id, 'Ada di Bengkel', '');
        }
      } else {
        updateLocalItem(id, 'Ada di Bengkel', '');
      }
    };

    /* Delete Order Handler */
    window.prosesHapusOrder = async function() {
      if (!targetDeleteId) return;

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ordersCollectionRef.path, targetDeleteId);
          await deleteDoc(docRef);
          window.showToast('Orderan berhasil dihapus');
        } catch(err) {
          console.error("Gagal hapus doc:", err);
          ordersData = ordersData.filter(o => o.id !== targetDeleteId);
          saveToLocalStorage();
          window.showToast('Orderan dihapus lokal');
        }
      } else {
        ordersData = ordersData.filter(o => o.id !== targetDeleteId);
        saveToLocalStorage();
        window.showToast('Orderan dihapus lokal');
      }

      targetDeleteId = null;
      window.tutupModal('modalHapus');
    };

    /* Firebase Configurations */
    const firebaseConfig = {
      apiKey: "AIzaSyDNZHfn6WFVGRQH8AzPQzHYYhtWjpJFT08",
      authDomain: "nedi-4cb8d.firebaseapp.com",
      projectId: "nedi-4cb8d",
      storageBucket: "nedi-4cb8d.firebasestorage.app",
      messagingSenderId: "594252750745",
      appId: "1:594252750745:web:d4fc11854d1aaaa1093d08",
      measurementId: "G-GY97JTDE3Y"
    };

    async function initDatabase() {
      updateSyncBadge('loading', 'Menghubungkan...');

      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        /* Anonymous Auth Sign In */
        try {
          await signInAnonymously(auth);
        } catch (authErr) {
          console.warn("Auth error:", authErr);
        }

        ordersCollectionRef = collection(db, 'orders');

        /* Realtime Firestore Listener */
        onSnapshot(ordersCollectionRef, (snapshot) => {
          isLocalStorageMode = false;
          ordersData = [];
          snapshot.forEach((docSnap) => {
            ordersData.push({ id: docSnap.id, ...docSnap.data() });
          });
          updateSyncBadge('online', 'Cloud Online Active');
          window.filterData();
        }, (error) => {
          console.warn("Firebase snapshot error (Beralih ke Penyimpanan Lokal):", error);
          aktifkanModeLokal("Akses Firestore ditolak atau aturan belum aktif");
        });

      } catch (err) {
        console.warn("Database init error:", err);
        aktifkanModeLokal("Gagal terhubung ke Firebase Server");
      }
    }

    /* Initialize on DOM Ready */
    document.addEventListener('DOMContentLoaded', () => {
      initDatabase();
    });
  </script>
</body>
</html>
