  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application Global Variables
    let db = null;
    let auth = null;
    let ordersCollectionRef = null;
    let ordersData = [];
    let currentRole = 'mekanik';
    let targetDeleteId = null;
    let isFirebaseReady = false;

    // App ID & Configuration
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'bengkel-stok-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDNZHfn6WFVGRQH8AzPQzHYYhtWjpJFT08",
      authDomain: "nedi-4cb8d.firebaseapp.com",
      projectId: "nedi-4cb8d",
      storageBucket: "nedi-4cb8d.firebasestorage.app",
      messagingSenderId: "594252750745",
      appId: "1:594252750745:web:d4fc11854d1aaaa1093d08",
      measurementId: "G-GY97JTDE3Y"
    };

    async function initDatabase() {
      // Timeout pengaman 3.5 detik jika koneksi Firebase lambat / terhalang
      const timeoutId = setTimeout(() => {
        if (!isFirebaseReady) {
          console.warn("Database online timeout, beralih ke penyimpanan lokal");
          loadLocalStorageFallback();
        }
      }, 3500);

      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // Firebase Auth initialization
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (authErr) {
          console.warn("Auth error, beralih ke mode lokal:", authErr);
          clearTimeout(timeoutId);
          loadLocalStorageFallback();
          return;
        }

        // Strict Path Rule: /artifacts/{appId}/public/data/orders
        ordersCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');

        // Realtime Listener
        onSnapshot(ordersCollectionRef, (snapshot) => {
          clearTimeout(timeoutId);
          ordersData = [];
          snapshot.forEach((docSnap) => {
            ordersData.push({ id: docSnap.id, ...docSnap.data() });
          });
          isFirebaseReady = true;
          updateSyncBadge(true, "Cloud Firebase Aktif");
          window.filterData();
        }, (error) => {
          console.warn("Firebase snapshot error, using local storage fallback:", error);
          clearTimeout(timeoutId);
          loadLocalStorageFallback();
        });

      } catch (err) {
        console.warn("Database init error, running offline mode:", err);
        clearTimeout(timeoutId);
        loadLocalStorageFallback();
      }
    }

    function loadLocalStorageFallback() {
      isFirebaseReady = false;
      const local = localStorage.getItem('bengkel_stok_orders');
      if (local) {
        ordersData = JSON.parse(local);
      } else {
        ordersData = [
          {
            id: 'demo-1',
            nama: 'Oli MPX2 0.8 Liter',
            kategori: 'Oli & Cairan',
            motor: 'Honda Vario / Beat',
            qty: '10 Botol',
            pemohon: 'Mas Agus',
            urgent: true,
            status: 'Belum Dipesan',
            catatan: 'Stok oli matic sisa 1 botol',
            pesanBos: '',
            tanggal: '2026-08-11'
          },
          {
            id: 'demo-2',
            nama: 'Kampas Rem Depan (Nissin)',
            kategori: 'Kampas & Rem',
            motor: 'Yamaha NMAX',
            qty: '3 Set',
            pemohon: 'Budi',
            urgent: false,
            status: 'Dipesan',
            catatan: '',
            pesanBos: 'Sudah di-order di Tokopedia, resi JNE: 881234. Est tiba besok.',
            tanggal: '2026-08-10'
          }
        ];
        saveLocalStorage();
      }
      updateSyncBadge(false, "Mode Penyimpanan Lokal");
      window.filterData();
    }

    function saveLocalStorage() {
      localStorage.setItem('bengkel_stok_orders', JSON.stringify(ordersData));
    }

    function updateSyncBadge(online, text) {
      const el = document.getElementById('syncStatus');
      if (online) {
        el.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ${text}`;
      } else {
        el.className = "inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30";
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> ${text}`;
      }
    }

    window.renderOrders = function(items) {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      // Update counters
      let countBelum = 0, countDipesan = 0, countSelesai = 0, countUrgent = 0;
      ordersData.forEach(o => {
        if (o.status === 'Belum Dipesan') countBelum++;
        if (o.status === 'Dipesan') countDipesan++;
        if (o.status === 'Ada di Bengkel') countSelesai++;
        if (o.urgent && o.status !== 'Ada di Bengkel') countUrgent++;
      });

      document.getElementById('countBelum').innerText = countBelum;
      document.getElementById('countDipesan').innerText = countDipesan;
      document.getElementById('countSelesai').innerText = countSelesai;
      document.getElementById('countUrgent').innerText = countUrgent;

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-8 text-center border border-slate-200">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto text-xl mb-3">
              <i class="fa-solid fa-inbox"></i>
            </div>
            <h4 class="font-bold text-slate-700">Tidak Ada Order Sparepart</h4>
            <p class="text-xs text-slate-400 mt-1">Klik tombol "+ Order Baru" untuk mengajukan permintaan stok.</p>
          </div>
        `;
        return;
      }

      // Sort items: Urgent first, then by date newest
      const sorted = [...items].sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0));

      sorted.forEach((item) => {
        let badgeStatus = 'bg-amber-100 text-amber-800 border-amber-300';
        let statusIcon = 'fa-hourglass-half';
        if (item.status === 'Dipesan') {
          badgeStatus = 'bg-blue-100 text-blue-800 border-blue-300';
          statusIcon = 'fa-truck-fast';
        } else if (item.status === 'Ada di Bengkel') {
          badgeStatus = 'bg-emerald-100 text-emerald-800 border-emerald-300';
          statusIcon = 'fa-circle-check';
        }

        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-4 border ${item.urgent && item.status !== 'Ada di Bengkel' ? 'border-rose-400 ring-2 ring-rose-100' : 'border-slate-200'} shadow-sm space-y-3 relative flex flex-col justify-between transition hover:shadow-md`;

        card.innerHTML = `
          <div class="space-y-2">
            <!-- Header Card -->
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 inline-block mb-1">
                  <i class="fa-solid fa-tag text-[9px] mr-1"></i>${item.kategori || 'Umum'}
                </span>
                <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nama}</h3>
                <p class="text-xs font-semibold text-indigo-600 mt-0.5">
                  <i class="fa-solid fa-motorcycle mr-1"></i>${item.motor}
                </p>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full border font-bold flex items-center gap-1 shrink-0 ${badgeStatus}">
                <i class="fa-solid ${statusIcon}"></i> ${item.status}
              </span>
            </div>

            ${item.urgent && item.status !== 'Ada di Bengkel' ? `
              <div class="bg-rose-50 border border-rose-200 text-rose-800 text-xs px-2.5 py-1.5 rounded-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation animate-bounce"></i> STOK HABIS! BUTUH SECEPATNYA
              </div>
            ` : ''}

            <!-- Details -->
            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <div>
                <span class="text-slate-400 block text-[10px]">Jumlah (Qty)</span>
                <span class="font-bold text-slate-800">${item.qty}</span>
              </div>
              <div>
                <span class="text-slate-400 block text-[10px]">Pemohon</span>
                <span class="font-semibold text-slate-800">${item.pemohon}</span>
              </div>
            </div>

            ${item.catatan ? `
              <p class="text-xs text-slate-600 italic bg-amber-50/50 p-2 rounded-lg border border-amber-100">
                <span class="font-semibold text-amber-800 not-italic">Catatan:</span> "${item.catatan}"
              </p>
            ` : ''}

            ${item.pesanBos ? `
              <div class="text-xs text-blue-900 bg-blue-50 p-2.5 rounded-xl border border-blue-200">
                <span class="font-bold text-blue-700 block mb-0.5"><i class="fa-solid fa-user-tie mr-1"></i>Pesan Bos/Owner:</span>
                "${item.pesanBos}"
              </div>
            ` : ''}
          </div>

          <!-- Card Footer & Actions -->
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-400 text-[10px]">
              <i class="fa-regular fa-clock mr-1"></i>${item.tanggal || 'Hari ini'}
            </span>

            <div class="flex items-center gap-1.5">
              ${currentRole === 'bos' ? `
                <button onclick="window.bukaModalStatusBos('${item.id}', '${item.status}', '${(item.pesanBos || '').replace(/'/g, "\\'")}')" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition">
                  <i class="fa-solid fa-pen-to-square mr-1"></i>Proses
                </button>
              ` : ''}

              ${item.status === 'Dipesan' ? `
                <button onclick="window.tandaiTibaDirect('${item.id}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm transition">
                  <i class="fa-solid fa-check mr-1"></i>Barang Tiba
                </button>
              ` : ''}

              <button onclick="window.konfirmasiHapus('${item.id}', '${item.nama.replace(/'/g, "\\'")}')" class="px-2 py-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Hapus Order">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    };

    window.filterData = function() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const kategori = document.getElementById('filterKategori').value;

      const filtered = ordersData.filter(item => {
        const matchSearch = (item.nama || '').toLowerCase().includes(search) ||
                            (item.motor || '').toLowerCase().includes(search) ||
                            (item.pemohon || '').toLowerCase().includes(search);

        let matchStatus = true;
        if (status === 'urgent') matchStatus = item.urgent && item.status !== 'Ada di Bengkel';
        else if (status !== 'semua') matchStatus = item.status === status;

        const matchKategori = kategori === 'semua' || item.kategori === kategori;

        return matchSearch && matchStatus && matchKategori;
      });

      window.renderOrders(filtered);
    };

    window.setRole = function(role) {
      currentRole = role;
      const btnMekanik = document.getElementById('btnRoleMekanik');
      const btnBos = document.getElementById('btnRoleBos');

      if (role === 'mekanik') {
        btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow";
        btnBos.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white";
        showToast("Switched to Mode Mekanik / Anak Buah", "info");
      } else {
        btnBos.className = "px-3 py-1.5 rounded-lg transition-all bg-blue-600 text-white shadow";
        btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white";
        showToast("Switched to Mode Bos / Owner Bengkel", "info");
      }
      window.filterData();
    };

    window.bukaModalTambah = function() {
      document.getElementById('formTambahOrder').reset();
      document.getElementById('modalTambah').classList.remove('hidden');
    };

    window.tutupModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    };

    window.quickFill = function(nama, kategori, motor) {
      document.getElementById('inputNama').value = nama;
      document.getElementById('inputKategori').value = kategori;
      document.getElementById('inputMotor').value = motor;
    };

    window.simpanOrder = async function(e) {
      e.preventDefault();
      const newOrder = {
        nama: document.getElementById('inputNama').value.trim(),
        kategori: document.getElementById('inputKategori').value,
        motor: document.getElementById('inputMotor').value.trim(),
        qty: document.getElementById('inputQty').value.trim(),
        pemohon: document.getElementById('inputPemohon').value.trim(),
        urgent: document.getElementById('inputUrgent').checked,
        catatan: document.getElementById('inputCatatan').value.trim(),
        status: 'Belum Dipesan',
        pesanBos: '',
        tanggal: new Date().toISOString().split('T')[0]
      };

      if (isFirebaseReady && ordersCollectionRef) {
        try {
          await addDoc(ordersCollectionRef, newOrder);
          showToast("Order sparepart berhasil disimpan!", "success");
        } catch (err) {
          console.error("Firebase add error:", err);
          saveLocallyNewOrder(newOrder);
        }
      } else {
        saveLocallyNewOrder(newOrder);
      }

      window.tutupModal('modalTambah');
    };

    function saveLocallyNewOrder(order) {
      order.id = 'local-' + Date.now();
      ordersData.unshift(order);
      saveLocalStorage();
      window.filterData();
      showToast("Order sparepart tersimpan (Lokal)", "success");
    }

    window.bukaModalStatusBos = function(id, currentStatus, currentPesan) {
      document.getElementById('bosOrderId').value = id;
      document.getElementById('bosStatusChoice').value = currentStatus;
      document.getElementById('bosPesan').value = currentPesan || '';
      document.getElementById('modalStatusBos').classList.remove('hidden');
    };

    window.simpanStatusBos = async function(e) {
      e.preventDefault();
      const id = document.getElementById('bosOrderId').value;
      const status = document.getElementById('bosStatusChoice').value;
      const pesanBos = document.getElementById('bosPesan').value.trim();

      if (isFirebaseReady && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', id);
          await updateDoc(docRef, { status, pesanBos });
          showToast("Status order diperbarui oleh Bos!", "success");
        } catch (err) {
          console.error("Firebase update error:", err);
          updateLocally(id, { status, pesanBos });
        }
      } else {
        updateLocally(id, { status, pesanBos });
      }

      window.tutupModal('modalStatusBos');
    };

    window.tandaiTibaDirect = async function(id) {
      if (isFirebaseReady && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', id);
          await updateDoc(docRef, { status: 'Ada di Bengkel' });
          showToast("Barang ditandai Tiba di Bengkel!", "success");
        } catch (err) {
          updateLocally(id, { status: 'Ada di Bengkel' });
        }
      } else {
        updateLocally(id, { status: 'Ada di Bengkel' });
      }
    };

    function updateLocally(id, updateFields) {
      ordersData = ordersData.map(o => o.id === id ? { ...o, ...updateFields } : o);
      saveLocalStorage();
      window.filterData();
      showToast("Status diperbarui (Lokal)", "success");
    }

    window.konfirmasiHapus = function(id, nama) {
      targetDeleteId = id;
      document.getElementById('hapusText').innerText = `Yakin ingin menghapus "${nama}"?`;
      document.getElementById('modalHapus').classList.remove('hidden');
    };

    window.prosesHapus = async function() {
      if (!targetDeleteId) return;

      if (isFirebaseReady && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', targetDeleteId);
          await deleteDoc(docRef);
          showToast("Orderan berhasil dihapus", "info");
        } catch (err) {
          console.error("Firebase delete error:", err);
          deleteLocally(targetDeleteId);
        }
      } else {
        deleteLocally(targetDeleteId);
      }

      targetDeleteId = null;
      window.tutupModal('modalHapus');
    };

    function deleteLocally(id) {
      ordersData = ordersData.filter(o => o.id !== id);
      saveLocalStorage();
      window.filterData();
      showToast("Orderan berhasil dihapus", "info");
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');

      let bg = 'bg-slate-900 text-white';
      let icon = 'fa-circle-info';
      if (type === 'success') {
        bg = 'bg-emerald-600 text-white';
        icon = 'fa-circle-check';
      } else if (type === 'error') {
        bg = 'bg-rose-600 text-white';
        icon = 'fa-triangle-exclamation';
      }

      toast.className = `${bg} px-4 py-3 rounded-2xl shadow-xl font-medium text-xs flex items-center gap-2 animate-fade-in`;
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;

      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Initialize application execution
    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
    });
  </script>
</body>
</html>
