<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="Catatan Barang Kosong - Lancar Langgeng Motor">
  <title>Catatan Barang Kosong - Lancar Langgeng Motor</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-16 antialiased selection:bg-blue-500 selection:text-white">

  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-30 shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-blue-600 to-blue-400 p-2.5 rounded-xl text-white font-black shadow-md shadow-blue-900/30">
          <i class="fa-solid fa-boxes-packing text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-extrabold text-white tracking-wide leading-tight">Catatan Barang Kosong</h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-xs font-semibold text-blue-400">Lancar Langgeng Motor</span>
            <span class="text-slate-600">•</span>
            <span id="syncBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
              Menghubungkan Cloud...
            </span>
          </div>
        </div>
      </div>

      <!-- Mode Role Switcher -->
      <div class="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-700/80 text-xs">
        <button id="btnRoleMekanik" onclick="window.setRole('mekanik')" class="px-3 py-1.5 rounded-lg transition-all bg-blue-600 text-white font-bold shadow">
          <i class="fa-solid fa-user-gear mr-1"></i> Mekanik
        </button>
        <button id="btnRoleBos" onclick="window.setRole('bos')" class="px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium">
          <i class="fa-solid fa-user-tie mr-1"></i> Mode Bos
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">

    <!-- Tab Navigation Bar -->
    <div class="grid grid-cols-3 gap-2 bg-slate-800 p-1.5 rounded-2xl border border-slate-700/80 shadow-md">
      <button id="tabBtnKosong" onclick="window.setActiveTab('kosong')" class="py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow">
        <i class="fa-solid fa-box-open"></i>
        <span>Barang Kosong</span>
        <span id="badgeKosong" class="bg-blue-950/60 px-2 py-0.5 rounded-full text-[11px]">0</span>
      </button>

      <button id="tabBtnOrder" onclick="window.setActiveTab('order')" class="py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
        <i class="fa-solid fa-truck-fast"></i>
        <span>Di-order</span>
        <span id="badgeOrder" class="bg-slate-900 px-2 py-0.5 rounded-full text-[11px]">0</span>
      </button>

      <button id="tabBtnSelesai" onclick="window.setActiveTab('selesai')" class="py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
        <i class="fa-solid fa-circle-check"></i>
        <span>Ada di Bengkel</span>
        <span id="badgeSelesai" class="bg-slate-900 px-2 py-0.5 rounded-full text-[11px]">0</span>
      </button>
    </div>

    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/80 shadow-sm space-y-3.5">
      <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
        <!-- Search Input -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="window.filterData()" placeholder="Cari nama barang yang habis..." class="w-full pl-10 pr-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs md:text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
        </div>

        <!-- Add Button -->
        <button onclick="window.bukaModalTambah()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-plus text-sm"></i> Tambahkan
        </button>
      </div>

      <!-- Quick Fill Buttons -->
      <div class="pt-2 border-t border-slate-700/60 flex items-center gap-2 overflow-x-auto pb-1">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider whitespace-nowrap">Isi Cepat:</span>
        <div class="flex gap-1.5">
          <button onclick="window.quickFill('Oli MPX2 0.8L', '10 Botol')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition whitespace-nowrap">
            + Oli MPX2
          </button>
          <button onclick="window.quickFill('Kampas Rem Depan Beat', '5 Set')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition whitespace-nowrap">
            + Kampas Rem Depan
          </button>
          <button onclick="window.quickFill('Busi NGK CPR9EA-9', '10 Pcs')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition whitespace-nowrap">
            + Busi NGK
          </button>
          <button onclick="window.quickFill('Aki GS GTZ5S', '3 Pcs')" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 transition whitespace-nowrap">
            + Aki GS
          </button>
        </div>
      </div>
    </div>

    <div id="cardsList" class="space-y-3">
      <!-- Data cards dynamically loaded here -->
    </div>

  </main>

  <div id="modalTambah" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-box-archive text-blue-400"></i> Catat Barang Kosong
        </h3>
        <button onclick="window.tutupModal('modalTambah')" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="formTambahOrder" onsubmit="window.prosesTambahOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Barang *</label>
          <input type="text" id="inputNama" required placeholder="Contoh: Kampas rem depan Vario" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Quantity (Jumlah) *</label>
          <input type="text" id="inputQty" required placeholder="Contoh: 5 Set / 10 Pcs / 2 Box" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
        </div>

        <div class="flex items-center gap-2 bg-rose-950/30 p-3 rounded-xl border border-rose-500/30">
          <input type="checkbox" id="inputUrgent" class="w-4 h-4 rounded text-rose-500 border-slate-700 bg-slate-900 focus:ring-0 cursor-pointer">
          <label for="inputUrgent" class="text-xs text-rose-300 font-semibold cursor-pointer">
            🚨 Tandai Stok Darurat (Mendesak)
          </label>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-700/60">
          <button type="button" onclick="window.tutupModal('modalTambah')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white transition shadow-md">
            Simpan Barang
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalStatusBos" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-tie text-amber-400"></i> Update Status Bos
        </h3>
        <button onclick="window.tutupModal('modalStatusBos')" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="formStatusBos" onsubmit="window.prosesUpdateBos(event)" class="space-y-4">
        <input type="hidden" id="bosOrderId">

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Status Pemesanan</label>
          <select id="bosStatusChoice" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none">
            <option value="kosong">📦 Barang Kosong (Belum Order)</option>
            <option value="order">🚚 Di-order (Proses Pengiriman)</option>
            <option value="selesai">✅ Ada di Bengkel (Sudah Tiba)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Pesan dari Bos (Opsional)</label>
          <textarea id="bosPesan" rows="3" placeholder="Contoh: Sudah di-order via Tokopedia. Estimasi sampai besok sore." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-700/60">
          <button type="button" onclick="window.tutupModal('modalStatusBos')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
            Batal
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition shadow-md">
            Update Status
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalHapus" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">Hapus Catatan Barang?</h3>
        <p class="text-xs text-slate-400 mt-1">Data akan dihapus secara permanen dari sistem online.</p>
      </div>
      <div class="flex justify-center gap-2 pt-2">
        <button onclick="window.tutupModal('modalHapus')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
          Batal
        </button>
        <button onclick="window.prosesHapusOrder()" class="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white transition shadow-md">
          Ya, Hapus
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* Global Constants & Firebase Configuration */
    const LOCAL_KEY = "llm_barang_kosong_v1";
    const DAY = 24 * 60 * 60 * 1000;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'nedi-4cb8d';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDNZHfn6WFVGRQH8AzPQzHYYhtWjpJFT08",
          authDomain: "nedi-4cb8d.firebaseapp.com",
          projectId: "nedi-4cb8d",
          storageBucket: "nedi-4cb8d.firebasestorage.app",
          messagingSenderId: "594252750745",
          appId: "1:594252750745:web:d4fc11854d1aaaa1093d08",
          measurementId: "G-GY97JTDE3Y"
        };

    /* State Variables */
    let db = null;
    let auth = null;
    let ordersData = [];
    let currentTab = 'kosong'; // 'kosong', 'order', 'selesai'
    let currentRole = 'mekanik'; // 'mekanik', 'bos'
    let targetDeleteId = null;
    let isLocalStorageMode = false;

    // Detect environment collection path
    const isCustomArtifactEnv = typeof __app_id !== 'undefined';
    const ordersCollectionPath = isCustomArtifactEnv 
      ? ['artifacts', appId, 'public', 'data', 'orders']
      : ['orders'];

    /* Toast Helper */
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-700';
      toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-2 transition-all transform translate-y-2 opacity-0`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-info-circle'}"></i> <span>${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    /* Tab Switcher */
    window.setActiveTab = function(tabName) {
      currentTab = tabName;
      const tabBtnKosong = document.getElementById('tabBtnKosong');
      const tabBtnOrder = document.getElementById('tabBtnOrder');
      const tabBtnSelesai = document.getElementById('tabBtnSelesai');

      [tabBtnKosong, tabBtnOrder, tabBtnSelesai].forEach(btn => {
        if (btn) btn.className = "py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white";
      });

      if (tabName === 'kosong' && tabBtnKosong) {
        tabBtnKosong.className = "py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow";
      } else if (tabName === 'order' && tabBtnOrder) {
        tabBtnOrder.className = "py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 bg-emerald-600 text-white shadow";
      } else if (tabName === 'selesai' && tabBtnSelesai) {
        tabBtnSelesai.className = "py-2.5 px-3 rounded-xl font-bold text-xs md:text-sm transition-all flex items-center justify-center gap-2 bg-slate-700 text-white shadow";
      }

      window.filterData();
    };

    /* Role Switcher */
    window.setRole = function(role) {
      currentRole = role;
      const btnMekanik = document.getElementById('btnRoleMekanik');
      const btnBos = document.getElementById('btnRoleBos');
      if (role === 'mekanik') {
        if (btnMekanik) btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all bg-blue-600 text-white font-bold shadow";
        if (btnBos) btnBos.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium";
      } else {
        if (btnBos) btnBos.className = "px-3 py-1.5 rounded-lg transition-all bg-amber-500 text-slate-950 font-bold shadow";
        if (btnMekanik) btnMekanik.className = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-white font-medium";
      }
      window.filterData();
    };

    /* Reset & Open Form Tambah */
    window.bukaModalTambah = function() {
      const namaEl = document.getElementById('inputNama');
      const qtyEl = document.getElementById('inputQty');
      const urgentEl = document.getElementById('inputUrgent');

      if (namaEl) namaEl.value = '';
      if (qtyEl) qtyEl.value = '';
      if (urgentEl) urgentEl.checked = false;

      window.bukaModal('modalTambah');
      setTimeout(() => { if (namaEl) namaEl.focus(); }, 100);
    };

    window.bukaModal = function(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove('hidden');
    };

    window.tutupModal = function(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add('hidden');
    };

    window.quickFill = function(nama, qty) {
      const namaEl = document.getElementById('inputNama');
      const qtyEl = document.getElementById('inputQty');
      const urgentEl = document.getElementById('inputUrgent');

      if (namaEl) namaEl.value = nama;
      if (qtyEl) qtyEl.value = qty;
      if (urgentEl) urgentEl.checked = false;

      window.bukaModal('modalTambah');
    };

    window.bukaModalStatusBos = function(id) {
      const item = ordersData.find(o => o.id === id);
      if (item) {
        document.getElementById('bosOrderId').value = id;
        document.getElementById('bosStatusChoice').value = item.status || 'order';
        document.getElementById('bosPesan').value = item.pesanBos || '';
        window.bukaModal('modalStatusBos');
      }
    };

    window.bukaModalHapus = function(id) {
      targetDeleteId = id;
      window.bukaModal('modalHapus');
    };

    function updateSyncBadge(type, text) {
      const badge = document.getElementById('syncBadge');
      if (!badge) return;
      if (type === 'online') {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> ${text}`;
      } else if (type === 'local') {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> ${text}`;
      } else {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-slate-700 text-slate-300 border border-slate-600";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse"></span> ${text}`;
      }
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem(LOCAL_KEY);
      if (stored) {
        try { ordersData = JSON.parse(stored); } catch(e) { ordersData = []; }
      } else {
        ordersData = [
          {
            id: 'sample-1',
            nama: 'Kampas Rem Depan Beat Vario',
            qty: '5 Set',
            urgent: true,
            pemohon: 'Mekanik',
            status: 'kosong',
            createdAt: Date.now(),
            tanggal: new Date().toLocaleDateString('id-ID')
          },
          {
            id: 'sample-2',
            nama: 'Oli MPX2 0.8L',
            qty: '10 Botol',
            urgent: false,
            pemohon: 'Mekanik',
            status: 'order',
            orderedAt: Date.now() - (2 * DAY),
            pesanBos: 'Sudah diorder via Tokopedia, estimasi besok tiba',
            createdAt: Date.now() - (2 * DAY),
            tanggal: new Date().toLocaleDateString('id-ID')
          }
        ];
        saveToLocalStorage();
      }
      window.filterData();
    }

    function saveToLocalStorage() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(ordersData));
      window.filterData();
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    window.filterData = function() {
      const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();

      let countKosong = 0, countOrder = 0, countSelesai = 0;
      ordersData.forEach(item => {
        if (item.status === 'kosong') countKosong++;
        if (item.status === 'order') countOrder++;
        if (item.status === 'selesai') countSelesai++;
      });

      if (document.getElementById('badgeKosong')) document.getElementById('badgeKosong').innerText = countKosong;
      if (document.getElementById('badgeOrder')) document.getElementById('badgeOrder').innerText = countOrder;
      if (document.getElementById('badgeSelesai')) document.getElementById('badgeSelesai').innerText = countSelesai;

      const filtered = ordersData.filter(item => {
        const itemStatus = item.status || 'kosong';
        if (itemStatus !== currentTab) return false;

        const matchSearch = (item.nama || '').toLowerCase().includes(searchVal) ||
                            (item.pemohon || '').toLowerCase().includes(searchVal);

        return matchSearch;
      });

      const container = document.getElementById('cardsList');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/60 p-8 rounded-2xl border border-slate-700/60 text-center text-slate-400 space-y-2">
            <i class="fa-solid fa-box-open text-3xl text-slate-500"></i>
            <p class="text-sm font-medium">Belum ada barang di tab ini.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let timerBadge = '';
        if (item.status === 'order' && item.orderedAt) {
          const daysLeft = Math.max(0, Math.ceil((7 * DAY - (Date.now() - item.orderedAt)) / DAY));
          timerBadge = `<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1"><i class="fa-regular fa-clock"></i> Sisa ${daysLeft} hari</span>`;
        }

        return `
          <div class="bg-slate-800 p-4 rounded-2xl border ${item.urgent ? 'border-rose-500/50 bg-rose-950/10' : 'border-slate-700/70'} shadow-sm space-y-3">
            <div class="flex justify-between items-start gap-2">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  ${item.urgent ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse">🚨 STOK DARURAT</span>' : ''}
                </div>
                <h3 class="font-bold text-white text-base mt-1">${esc(item.nama)}</h3>
              </div>
              ${timerBadge}
            </div>

            <div class="grid grid-cols-3 gap-2 text-xs text-slate-300 bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
              <div><span class="text-slate-500 block text-[10px]">QUANTITY</span> <strong class="text-amber-400 font-bold text-sm">${esc(item.qty || '-')}</strong></div>
              <div><span class="text-slate-500 block text-[10px]">DICATAT OLEH</span> <strong class="text-slate-200">${esc(item.pemohon || 'Mekanik')}</strong></div>
              <div><span class="text-slate-500 block text-[10px]">TANGGAL</span> <strong class="text-slate-200">${esc(item.tanggal || '-')}</strong></div>
            </div>

            ${item.pesanBos ? `
              <div class="text-xs text-blue-200 bg-blue-950/30 p-2.5 rounded-xl border border-blue-500/30 flex items-start gap-2">
                <i class="fa-solid fa-user-tie text-blue-400 mt-0.5"></i>
                <div>
                  <strong class="block text-[10px] uppercase tracking-wider text-blue-400 font-bold">Pesan Bos:</strong>
                  <span>${esc(item.pesanBos)}</span>
                </div>
              </div>
            ` : ''}

            <div class="flex justify-between items-center pt-2 border-t border-slate-700/60">
              <div class="flex gap-2">
                ${item.status === 'kosong' ? `
                  <button onclick="window.orderItem('${item.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-truck-fast"></i> ORDER
                  </button>
                ` : ''}

                ${item.status === 'order' ? `
                  <button onclick="window.markArrived('${item.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i> BARANG TIBA
                  </button>
                ` : ''}

                ${currentRole === 'bos' ? `
                  <button onclick="window.bukaModalStatusBos('${item.id}')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> Update Bos
                  </button>
                ` : ''}
              </div>

              <button onclick="window.bukaModalHapus('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition" title="Hapus Data">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    };

    window.prosesTambahOrder = async function(e) {
      e.preventDefault();
      const namaEl = document.getElementById('inputNama');
      const qtyEl = document.getElementById('inputQty');
      const urgentEl = document.getElementById('inputUrgent');

      const nama = namaEl ? namaEl.value.trim() : '';
      const qty = qtyEl ? qtyEl.value.trim() : '';
      const urgent = urgentEl ? urgentEl.checked : false;

      if (!nama || !qty) {
        window.showToast('Nama barang & quantity wajib diisi!', 'error');
        return;
      }

      const pemohon = currentRole === 'bos' ? 'Bos' : 'Mekanik';

      const newItem = {
        nama,
        qty,
        pemohon,
        urgent,
        status: 'kosong',
        pesanBos: '',
        createdAt: Date.now(),
        tanggal: new Date().toLocaleDateString('id-ID')
      };

      if (!isLocalStorageMode && db) {
        try {
          const colRef = collection(db, ...ordersCollectionPath);
          await addDoc(colRef, newItem);
          window.showToast('Barang kosong berhasil dicatat!');
        } catch(err) {
          console.error("Error Add Doc:", err);
          newItem.id = 'loc-' + Date.now();
          ordersData.unshift(newItem);
          saveToLocalStorage();
          window.showToast('Tersimpan di storage lokal');
        }
      } else {
        newItem.id = 'loc-' + Date.now();
        ordersData.unshift(newItem);
        saveToLocalStorage();
        window.showToast('Tersimpan di storage lokal');
      }

      /* Clean inputs automatically */
      if (namaEl) namaEl.value = '';
      if (qtyEl) qtyEl.value = '';
      if (urgentEl) urgentEl.checked = false;

      window.tutupModal('modalTambah');
    };

    window.orderItem = async function(id) {
      const updateData = {
        status: 'order',
        orderedAt: Date.now()
      };

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ...ordersCollectionPath, id);
          await updateDoc(docRef, updateData);
          window.showToast('Barang dipindahkan ke Di-order!');
        } catch(err) {
          updateLocalItem(id, updateData);
        }
      } else {
        updateLocalItem(id, updateData);
      }
    };

    window.markArrived = async function(id) {
      const updateData = { status: 'selesai' };

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ...ordersCollectionPath, id);
          await updateDoc(docRef, updateData);
          window.showToast('Barang telah tiba di Bengkel!');
        } catch(err) {
          updateLocalItem(id, updateData);
        }
      } else {
        updateLocalItem(id, updateData);
      }
    };

    window.prosesUpdateBos = async function(e) {
      e.preventDefault();
      const id = document.getElementById('bosOrderId').value;
      const statusChoice = document.getElementById('bosStatusChoice').value;
      const pesanBos = document.getElementById('bosPesan').value;

      const updateData = {
        status: statusChoice,
        pesanBos: pesanBos
      };

      if (statusChoice === 'order') {
        updateData.orderedAt = Date.now();
      }

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ...ordersCollectionPath, id);
          await updateDoc(docRef, updateData);
          window.showToast('Status berhasil diupdate!');
        } catch(err) {
          updateLocalItem(id, updateData);
        }
      } else {
        updateLocalItem(id, updateData);
      }

      window.tutupModal('modalStatusBos');
    };

    function updateLocalItem(id, fields) {
      const idx = ordersData.findIndex(o => o.id === id);
      if (idx !== -1) {
        ordersData[idx] = { ...ordersData[idx], ...fields };
        saveToLocalStorage();
        window.showToast('Data diperbarui!');
      }
    }

    window.prosesHapusOrder = async function() {
      if (!targetDeleteId) return;

      if (!isLocalStorageMode && db) {
        try {
          const docRef = doc(db, ...ordersCollectionPath, targetDeleteId);
          await deleteDoc(docRef);
          window.showToast('Data berhasil dihapus!');
        } catch(err) {
          ordersData = ordersData.filter(o => o.id !== targetDeleteId);
          saveToLocalStorage();
          window.showToast('Dihapus dari storage lokal');
        }
      } else {
        ordersData = ordersData.filter(o => o.id !== targetDeleteId);
        saveToLocalStorage();
        window.showToast('Dihapus dari storage lokal');
      }

      targetDeleteId = null;
      window.tutupModal('modalHapus');
    };

    async function initDatabase() {
      updateSyncBadge('loading', 'Menghubungkan Firebase...');

      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        /* Authenticate before executing Firestore operations */
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        const colRef = collection(db, ...ordersCollectionPath);

        /* Realtime Firestore listener */
        onSnapshot(colRef, (snapshot) => {
          isLocalStorageMode = false;
          ordersData = [];
          snapshot.forEach((docSnap) => {
            ordersData.push({ id: docSnap.id, ...docSnap.data() });
          });
          updateSyncBadge('online', 'Cloud Online');
          window.filterData();
        }, (error) => {
          console.warn("Firestore listener fallback to LocalStorage:", error);
          isLocalStorageMode = true;
          updateSyncBadge('local', 'Storage Lokal');
          loadFromLocalStorage();
        });

      } catch (err) {
        console.warn("Firebase init error, using LocalStorage:", err);
        isLocalStorageMode = true;
        updateSyncBadge('local', 'Storage Lokal');
        loadFromLocalStorage();
      }
    }

    /* Start App on DOM Ready */
    document.addEventListener('DOMContentLoaded', () => {
      initDatabase();
    });
  </script>
</body>
</html>
